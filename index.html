<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cs Map Info</title>
    <link rel="shortcut icon" href="img/Favicon/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <a href="index.html">
            <img src="img/Logo/logo.svg" alt="LOGO" class="logo">
        </a>
        
        <div class="card">
            <h1>Map Selection</h1>
            <div class="picture-box">
                <a href="html/Ancient.html"><img src="img/maps-logo/AnicentMap.png" alt="Ancient"></a>
                <a href="html/Anubis.html"><img src="img/maps-logo/AnubisMap.png" alt="Anubis"></a>
                <a href="html/Cache.html"><img src="img/maps-logo/CacheMap.png" alt="Cache"></a>
                <a href="html/Dust2.html"><img src="img/maps-logo/Dust2Map.png" alt="Dust2"></a>
                <a href="html/Inferno.html"><img src="img/maps-logo/InfernoMap.png" alt="Inferno"></a>
                <a href="html/Mirage.html"><img src="img/maps-logo/MiargeMap.png" alt="Mirage"></a>
                <a href="html/Nuke.html"><img src="img/maps-logo/NukeMap.png" alt="Nuke"></a>
            </div>
            <p>Please select a map</p>
        </div> 
    </div>


    <style>
        body{
            background-color: antiquewhite;
            margin: 10px auto;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            max-width: 1000px;
        }

        .container{
            background-color: antiquewhite;
            max-width: 1000px;
        }

        .picture-box{
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .picture-box img{
            max-width: 100%;
            width: 250px;
            height: auto;
            border-radius: 10px;
        }

        .card{
            margin-top: 200px;
            background-color: white;
            padding: 20px;
            border: 2px solid black;
            border-radius: 20px;
            max-width: 900px;
        }

        img{
            width: 100%;
            border-radius: 20px;
        }
        h1{
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }
        a{
            text-align: center;
            text-decoration: none;
            color:indianred;
        }
        p{
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            font-size: 30px;
        }
        .logo  {  
            margin-left: auto;
            max-width: 480px;
            display: block;
            margin: 20px auto;
        }
        header {
            width: 100%;
            padding: 1rem;
            box-sizing: border-box;
        }

    </style>
</body>
</html>
